# Force structured issue forms; free-form reports lose the evidence
# (seed/hash/stage) that makes worldgen bugs actionable.
blank_issues_enabled: false

contact_links:
  - name: Security vulnerability (private)
    url: https://github.com/Soju06/hyperchunk/security/advisories/new
    about: >-
      Report security issues privately via GitHub Security Advisories —
      do NOT open a public issue. See SECURITY.md.
