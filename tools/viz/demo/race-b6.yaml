# B-6 3-way public race — hc-e6 measured walls: vanilla 11.9s / C2ME 3.7s / hyperchunk FREE 0.894s.
#
# hyperchunk panel: REAL per-chunk timeline, SAME STAGE as the race walls
#   (VIZ-2 capture: FREE 20T on hc-e6, canonical PASS, gen_wall 889.4ms within
#   the B-6 band — see timeline meta). Two-stage reveal (VIZ-3, owner-approved):
#   stage-1 at chain end (t_stage1_ms — terrain shape final, deco pending)
#   paints a muted terrain tone; the final pixels appear at event=complete —
#   a chunk's last substantive block write (own chain end ∨ deco events whose
#   ±1 write window covers it). normalize_wall_s pins the panel clock to the published
#   B-6 gen_wall (0.894s); the timeline wall (0.912s) additionally carries
#   ~2.5% of interleaved replay-input parse (harness overhead) that the
#   published number excludes for all three systems (gen_wall-setup symmetric
#   disclosure). Rescale factor 0.980, recorded in loaded meta
#   (time_scaled_from_wall_s). Previous claw-stage capture is kept at
#   timelines/hyperchunk-free-claw.json for comparison.
# Vanilla / C2ME panels: MEASURED per-chunk timelines (VIZ-4, hc-e6, same
#   stage as the race walls) — forceload + `execute if loaded` FULL-status
#   probe at 0.1s poll, observer-load gate passed (interleaved 3s vs 0.1s
#   runs; 0.1s medians inside the B-6 band). Chosen runs: vanilla p01-2
#   (t1 11.866s), c2me p01-1 (t1 3.394s) — median-wall gate-passing runs.
#   normalize_wall_s pins both panel clocks to the published B-6 walls
#   (11.9 / 3.7; rescale 1.0029 / 1.0902 — the published walls carry the
#   coarser 0.5s-poll one-sided overshoot; recorded in loaded meta as
#   time_scaled_from_wall_s). The measured shape is an END STEP-FUNCTION
#   for both (FULL promotions pile into the last poll cycles: vanilla 0
#   until 11.64s, C2ME 0 until 3.39s) — that is the honest externally
#   observable picture (sub-full progress is invisible without a mod hook);
#   do not smooth it. The renderer prints a one-line micro-caption
#   `probe ±0.1s` for panels carrying meta.probe_interval_ms; the synthetic
#   caption path remains for synthetic timelines (kept on disk for contrast:
#   timelines/vanilla-b6-scan.json, timelines/c2me-b6-wave.json).
theme: ../themes/ivory.json
layout: race3
view: reveal
fps: 25
hold_s: 1.5
header:
  title: "1024 chunks, one race"
  sub: "same seed · same machine"
endcard:
  enabled: true
  hold_s: 1.5
  wordmark: hyperchunk
  headline: auto        # baseline wall / fastest wall → "13.3× faster"
  sub: "and the only one that generates the same world, bit for bit, every run"
panels:
  - name: Vanilla
    accent: vanilla
    timeline: timelines/vanilla-hce6.json
    tile: tiles/vanilla-b6.png
    normalize_wall_s: 11.9
  - name: C2ME
    accent: c2me
    timeline: timelines/c2me-hce6.json
    tile: tiles/c2me-b6.png
    normalize_wall_s: 3.7
  - name: hyperchunk
    accent: hyperchunk
    timeline: timelines/hyperchunk-free-hce6.json
    tile: tiles/hyperchunk-free.png
    normalize_wall_s: 0.894
