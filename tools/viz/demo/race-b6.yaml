# B-6 3-way public race — hc-e6 measured walls: vanilla 11.9s / C2ME 3.7s / hyperchunk FREE 0.894s.
#
# hyperchunk panel: REAL per-chunk timeline, SAME STAGE as the race walls
#   (VIZ-2 capture: FREE 20T on hc-e6, canonical PASS, gen_wall 889.4ms within
#   the B-6 band — see timeline meta). Two-stage reveal (VIZ-3, owner-approved):
#   stage-1 at chain end (t_stage1_ms — terrain shape final, deco pending)
#   paints a muted terrain tone; the final pixels appear at event=complete —
#   a chunk's last substantive block write (own chain end ∨ deco events whose
#   ±1 write window covers it). normalize_wall_s pins the panel clock to the published
#   B-6 gen_wall (0.894s); the timeline wall (0.912s) additionally carries
#   ~2.5% of interleaved replay-input parse (harness overhead) that the
#   published number excludes for all three systems (gen_wall-setup symmetric
#   disclosure). Rescale factor 0.980, recorded in loaded meta
#   (time_scaled_from_wall_s). Previous claw-stage capture is kept at
#   timelines/hyperchunk-free-claw.json for comparison.
# Vanilla / C2ME panels: INSTRUMENTED per-chunk timelines (VIZ-5, hc-e6,
#   same stage as the race walls) — a minimal Fabric mixin mod
#   (tools/viz/capture/chunk-timeline-mod) timestamps every ChunkStep
#   completion server-side, in-memory, single flush at exit. Two-stage
#   semantics mirror the hyperchunk panel: t_stage1_ms = SURFACE completion
#   (terrain shape final, deco pending), t_done_ms = FEATURES completion
#   (last block content write). Overhead gate passed (interleaved 3 clean vs
#   3 instrumented runs; instrumented wall medians vanilla 11.708s /
#   c2me 3.355s inside the VIZ-4 measured bands 11.7-11.9 / 3.35-3.69).
#   Chosen runs: vanilla v5i-1 (t1 11.708s), c2me v5i-2 (t1 3.355s) —
#   median-wall instrumented runs. Vanilla dedicated cannot load mods, so
#   the vanilla panel shape comes from Fabric loader 0.19.3 + the hook mod
#   ONLY (no C2ME; the loader/mod add no worldgen changes — golden-pipeline
#   precedent; NOTE vanilla 26.2 itself is content-nondeterministic
#   run-to-run, ADR-007, so no two runs are bit-identical) —
#   meta.instrumented records this; fairness footnote in
#   .hermes/notes/viz/VIZ-5-instrumented-streaming.md. normalize_wall_s
#   pins both panel clocks to the published B-6 walls (11.9 / 3.7; rescale
#   1.0164 / 1.1028, recorded in loaded meta as time_scaled_from_wall_s).
#   Unlike the external FULL-promotion probe (VIZ-4, kept on disk for
#   contrast: timelines/vanilla-hce6.json, c2me-hce6.json — honest end
#   step-functions), the instrumented series show the servers' real
#   internal progress (features-done p50 at 46% / 58% of wall). Caption:
#   `instrumented chunk timing · measured walls` keyed on
#   meta.instrumented; probe/synthetic caption paths remain for the
#   on-disk contrast timelines (also timelines/vanilla-b6-scan.json,
#   timelines/c2me-b6-wave.json).
theme: ../themes/ivory.json
layout: race3
view: reveal
fps: 25
hold_s: 1.5
header:
  title: "1024 chunks, one race"
  sub: "same seed · same machine"
endcard:
  enabled: true
  hold_s: 1.5
  wordmark: hyperchunk
  headline: auto        # baseline wall / fastest wall → "13.3× faster"
  sub: "and the only one that generates the same world, bit for bit, every run"
panels:
  - name: Vanilla
    accent: vanilla
    timeline: timelines/vanilla-hce6-instr.json
    tile: tiles/vanilla-b6.png
    normalize_wall_s: 11.9
  - name: C2ME
    accent: c2me
    timeline: timelines/c2me-hce6-instr.json
    tile: tiles/c2me-b6.png
    normalize_wall_s: 3.7
  - name: hyperchunk
    accent: hyperchunk
    timeline: timelines/hyperchunk-free-hce6.json
    tile: tiles/hyperchunk-free.png
    normalize_wall_s: 0.894
