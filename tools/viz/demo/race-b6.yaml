# B-6 3-way public race — hc-e6 measured walls: vanilla 11.9s / C2ME 3.7s / hyperchunk FREE 0.894s.
#
# hyperchunk panel: REAL per-chunk timeline, SAME STAGE as the race walls
#   (VIZ-2 capture: FREE 20T on hc-e6, canonical PASS, gen_wall 889.4ms within
#   the B-6 band — see timeline meta). event=complete: a chunk reveals at its
#   last substantive block write (own chain end ∨ deco events whose ±1 write
#   window covers it). normalize_wall_s pins the panel clock to the published
#   B-6 gen_wall (0.894s); the timeline wall (0.912s) additionally carries
#   ~2.5% of interleaved replay-input parse (harness overhead) that the
#   published number excludes for all three systems (gen_wall-setup symmetric
#   disclosure). Rescale factor 0.980, recorded in loaded meta
#   (time_scaled_from_wall_s). Previous claw-stage capture is kept at
#   timelines/hyperchunk-free-claw.json for comparison.
# Vanilla / C2ME panels: SYNTHETIC timelines (scan / wave patterns, marked
#   meta.synthetic=true) — only their wall_s values (11.9 / 3.7) are measured
#   (B-6). The renderer prints a bottom micro-caption naming synthetic panels
#   as long as any remain. Real per-chunk capture is a follow-up task.
theme: ../themes/ivory.json
layout: race3
view: reveal
fps: 25
hold_s: 1.5
header:
  title: "1024 chunks, one race"
  sub: "same seed · same machine"
endcard:
  enabled: true
  hold_s: 1.5
  wordmark: hyperchunk
  headline: auto        # baseline wall / fastest wall → "13.3× faster"
  sub: "and the only one that generates the same world, bit for bit, every run"
panels:
  - name: Vanilla
    accent: vanilla
    timeline: timelines/vanilla-b6-scan.json
    tile: tiles/vanilla-b6.png
  - name: C2ME
    accent: c2me
    timeline: timelines/c2me-b6-wave.json
    tile: tiles/c2me-b6.png
  - name: hyperchunk
    accent: hyperchunk
    timeline: timelines/hyperchunk-free-hce6.json
    tile: tiles/hyperchunk-free.png
    normalize_wall_s: 0.894
